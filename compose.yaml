# Developer environment — single `podman-compose up` starts everything.
# For production-like k8s testing use `make cluster` instead.

x-worker: &worker
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  env_file: .env
  environment:
    - LITELLM_LOG=ERROR
  volumes:
    - ./agents:/app/agents:ro,z
    - ./prompts:/app/prompts:ro,z
    - ./scripts:/app/scripts:ro,z
    - ${GOOGLE_APPLICATION_CREDENTIALS_FILE:-./gcp-credentials.json}:/secrets/gcp-credentials.json:ro,z
  depends_on:
    temporal:
      condition: service_healthy
    rustfs:
      condition: service_healthy
    ollama-pull:
      condition: service_completed_successfully
  restart: on-failure

services:

  # ── Temporal ────────────────────────────────────────────────────────────────
  # PostgreSQL backend for Temporal — persisted via named volume.
  temporal-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: docker.io/temporalio/auto-setup:1.24
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=temporal-db
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DB_PORT=5432
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
    ports:
      - "7233:7233"
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: docker.io/temporalio/ui:2.30.0
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # ── RustFS (S3-compatible object store) ──────────────────────────────────────
  rustfs:
    image: docker.io/rustfs/rustfs:latest
    command: rustfs server /data --console-address ":9001"
    environment:
      - RUSTFS_ROOT_USER=rustfsadmin
      - RUSTFS_ROOT_PASSWORD=rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data:z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama ──────────────────────────────────────────────────────────────────
  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama:z
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot service that pulls the model then exits.
  # Workers wait on this via depends_on: service_completed_successfully.
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    entrypoint: ["sh", "-c", "case \"$LITELLM_MODEL\" in ollama/*) MODEL=$(echo $LITELLM_MODEL | sed 's|^ollama/||'); /bin/ollama list | grep -q \"$MODEL\" && echo \"Model $MODEL already present, skipping pull.\" || /bin/ollama pull $MODEL ;; *) echo \"Non-Ollama model ($LITELLM_MODEL), skipping pull.\"; exit 0 ;; esac"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # ── Gitea (local GitHub simulator) ──────────────────────────────────────────
  gitea:
    image: docker.io/gitea/gitea:1.22
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__ROOT_URL=http://gitea:3000/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__log__LEVEL=warn
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data:z
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── Jira simulator ──────────────────────────────────────────────────────────
  jira-simulator:
    build:
      context: simulator/jira
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jira-data:/data:z
    environment:
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY:-SDLC}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/rest/api/2/serverInfo')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Workers ─────────────────────────────────────────────────────────────────
  orchestrator:
    <<: *worker
    command: python -m agents.orchestrator.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=orchestrator
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json

  requirements-agent:
    <<: *worker
    command: python -m agents.requirements_agent.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=requirements-agent
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - JIRA_URL=http://jira-simulator:8080
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json

  github-agent:
    <<: *worker
    command: python -m agents.github_agent.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=github-agent
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - GITHUB_BASE_URL=http://gitea:3000/api/v1
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json
      - CONTAINER_SOCKET=/var/run/podman/podman.sock
    volumes:
      - ./agents:/app/agents:ro,z
      - ./prompts:/app/prompts:ro,z
      - ./scripts:/app/scripts:ro,z
      - ${GOOGLE_APPLICATION_CREDENTIALS_FILE:-./gcp-credentials.json}:/secrets/gcp-credentials.json:ro,z
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/podman/podman.sock
    security_opt:
      - label:disable

  dep-tree:
    image: localhost/openshift-dep-tree:latest
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  openshift-agent:
    <<: *worker
    command: python -m agents.openshift_agent.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=openshift-agent
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - GITHUB_BASE_URL=http://gitea:3000/api/v1
      - MCP_SERVER_URL=http://dep-tree:8000/sse
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json
    depends_on:
      dep-tree:
        condition: service_healthy

  jira-agent:
    <<: *worker
    command: python -m agents.jira_agent.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=jira-agent
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - JIRA_URL=http://jira-simulator:8080
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json

  enhancement-agent:
    <<: *worker
    command: python -m agents.enhancement_agent.worker
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=enhancement-agent
      - S3_ENDPOINT=rustfs:9000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - GITHUB_BASE_URL=http://gitea:3000/api/v1
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gcp-credentials.json

  # ── Dashboard ───────────────────────────────────────────────────────────────
  dashboard:
    <<: *worker
    command: uvicorn dashboard.app:app --host 0.0.0.0 --port 8501 --reload
    ports:
      - "8501:8501"
    volumes:
      - ./agents:/app/agents:ro,z
      - ./dashboard:/app/dashboard:ro,z
      - ./prompts:/app/prompts:z
      - ./scripts:/app/scripts:ro,z
      - ${GOOGLE_APPLICATION_CREDENTIALS_FILE:-./gcp-credentials.json}:/secrets/gcp-credentials.json:ro,z
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_TASK_QUEUE=orchestrator
      - S3_ENDPOINT=rustfs:9000
      - TEMPORAL_UI_EXTERNAL_URL=http://localhost:8233
      - RUSTFS_EXTERNAL_URL=http://localhost:9001
      - GITEA_EXTERNAL_URL=http://localhost:3000
      - JIRA_EXTERNAL_URL=http://localhost:8080
      - DEP_TREE_EXTERNAL_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  temporal-db-data:
  rustfs-data:
  ollama-data:
  gitea-data:
  jira-data:
