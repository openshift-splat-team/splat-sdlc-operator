[project]
name = "agent-sdlc-workflow"
version = "0.1.0"
description = "Agentic SDLC workflow system powered by Temporal and LiteLLM"
requires-python = ">=3.11"
dependencies = [
    "temporalio>=1.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "litellm>=1.40.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "minio>=7.2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
requirements-agent = [
    "jira>=3.8.0",
]
github-agent = [
    "PyGithub>=2.3.0",
]
jira-agent = [
    "jira>=3.8.0",
]
enhancement-agent = [
    "PyGithub>=2.3.0",
]
openshift-agent = [
    "PyGithub>=2.3.0",
    "mcp>=1.20.0",
]
review-agent = [
    "PyGithub>=2.3.0",
]
vertex-ai = [
    "google-cloud-aiplatform>=1.60.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "openpyxl>=3.1.0",
    # Agent optional deps — needed locally for trigger.py and dev-* worker targets.
    "PyGithub>=2.3.0",
    "jira>=3.8.0",
    "mcp>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
