description: "SDLC agent prompt evaluation — multi-model comparison"

prompts:
  - id: "{{__template_path}}"
    label: "passthrough"

# Model names must match the IDs in your llama-swap config. See
# llama-swap.example.yaml for a starter config that defines these four
# models. llama-swap auto-swaps the backend when the model name changes,
# so only one model runs at a time on your GPU.
#
# Start llama-swap:
#   llama-swap --config evals/llama-swap.example.yaml --listen localhost:8080
#
# Run comparison:
#   make eval-compare

providers:
  - id: file://provider.py
    label: "Qwen3-14B"
    config:
      litellm_model: "openai/Qwen3-14B"
      llm_api_key: "any"
      llm_api_base: "${LLM_API_BASE:-http://localhost:8080/v1}"
      temperature: 0.2
      max_tokens: 4096

  - id: file://provider.py
    label: "Qwen3-30B-A3B"
    config:
      litellm_model: "openai/Qwen3-30B-A3B"
      llm_api_key: "any"
      llm_api_base: "${LLM_API_BASE:-http://localhost:8080/v1}"
      temperature: 0.2
      max_tokens: 4096

  - id: file://provider.py
    label: "Gemma-4-12B"
    config:
      litellm_model: "openai/Gemma-4-12B"
      llm_api_key: "any"
      llm_api_base: "${LLM_API_BASE:-http://localhost:8080/v1}"
      temperature: 0.2
      max_tokens: 4096

  - id: file://provider.py
    label: "Gemma-3-12B"
    config:
      litellm_model: "openai/Gemma-3-12B"
      llm_api_key: "any"
      llm_api_base: "${LLM_API_BASE:-http://localhost:8080/v1}"
      temperature: 0.2
      max_tokens: 4096

defaultTest:
  assert:
    - type: is-json

tests:
  - file://fixtures/identify_repos.yaml
  - file://fixtures/run_review.yaml
